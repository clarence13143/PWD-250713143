<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict/EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<!-- deklarasi xhtml, dengan dasar aturannya adalah html yang mengikuti aturan xml -->
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>My Link</title>
    <style>
        body {
        background-color: rgb(32,99,174);
        min-height: 100vh;
        margin:0;
        }

        #informasi{
            background-color: rgba(255,255,255,0.9);
            padding: 10px 30px 5px 20px;
            box-shadow: 0 0.5px 1px 0 rgb(48, 77,142);
            color: rgb(73,73,73);
            font-family: sans-serif;
            font-weight: 600;
            text-align: center;
        }

        #informasi{
            background-color: rgb(37,108,188);
            margin-left: -30px;
            margin-right: -30px;
            margin-top: -20px;
            padding: 20px 0;
            color: white;
            text-align: center;
        }

        .link{
            display: flex;
            justify-content: center;
            align-items: center;
            width: fit-content;
            margin: 20px auto 0;
            padding: 10px 20px;
            border-radius: 10px;
            background-color: rgb(201,218,255);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            transition: all 0.2s linear;
        }

    </style>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<!-- bagian kepala halaman. info dapat dilihat pada jendela halaman website, dmn judul halamanakan ditampilkan -->
<body>
    <div id="informasi">
        <h1>My Link</h1>
        <p>
            Mulailah membangun rencana akademik anda untuk mencapai karir dan tujuan hidup anda bersama kami.
        </p>
        <p>
            Untuk mendapatkan infomasi lebih lanjut, silakan kunjungi website resmi UAJY dibawah ini.
        </p>
    </div>
    <div class="link">
        <a href="https://www.uajy.ac.id/">Website UAJY</a>
    </div>
</body>
<!-- bagian tubuh halaman. ini adalah area di mana konten utama halaman ditampilkan -->
</html>
